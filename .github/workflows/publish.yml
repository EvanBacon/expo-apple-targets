name: Publish beta to npm

on:
  push:
    branches: [main]
    paths:
      - "packages/apple-targets/**"
      - "packages/create-target/**"
      - ".github/workflows/publish.yml"
      - ".github/scripts/next-publish-version.mjs"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  publish-beta:
    if: github.repository == 'EvanBacon/expo-apple-targets' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Detect package changes
        id: changes
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "apple=true" >> $GITHUB_OUTPUT
            echo "create=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          CHANGED=$(git diff --name-only HEAD~1 HEAD)
          APPLE=false
          CREATE=false
          if echo "$CHANGED" | grep -Eq "^packages/apple-targets/"; then
            APPLE=true
          fi
          if echo "$CHANGED" | grep -Eq "^packages/create-target/"; then
            CREATE=true
          fi
          echo "apple=$APPLE" >> $GITHUB_OUTPUT
          echo "create=$CREATE" >> $GITHUB_OUTPUT

      - name: Setup bun
        if: steps.changes.outputs.apple == 'true' || steps.changes.outputs.create == 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Setup Node.js
        if: steps.changes.outputs.apple == 'true' || steps.changes.outputs.create == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        if: steps.changes.outputs.apple == 'true' || steps.changes.outputs.create == 'true'
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Build and publish @bacons/apple-targets beta
        if: steps.changes.outputs.apple == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "::error::NPM_TOKEN secret is missing. Add it under repo Settings → Secrets. Skipping publish."
            exit 1
          fi
          cd packages/apple-targets
          LOCAL=$(node -p "require('./package.json').version")
          PUBLISHED=$(npm view @bacons/apple-targets dist-tags.latest 2>/dev/null || echo "")
          NEW=$(node ../../.github/scripts/next-publish-version.mjs "$LOCAL" "$PUBLISHED" "beta.${{ github.run_number }}.${{ github.run_attempt }}")
          echo "Publish @bacons/apple-targets beta: local=$LOCAL npm=${PUBLISHED:-<none>} -> $NEW"
          node -e "
            const fs = require('fs');
            const p = JSON.parse(fs.readFileSync('package.json'));
            p.version = '$NEW';
            fs.writeFileSync('package.json', JSON.stringify(p, null, 2) + '\n');
          "
          bun run build
          npm publish --access public --tag beta --provenance

      - name: Build and publish create-target beta
        if: steps.changes.outputs.create == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "::error::NPM_TOKEN secret is missing. Add it under repo Settings → Secrets. Skipping publish."
            exit 1
          fi
          cd packages/create-target
          LOCAL=$(node -p "require('./package.json').version")
          PUBLISHED=$(npm view create-target dist-tags.latest 2>/dev/null || echo "")
          NEW=$(node ../../.github/scripts/next-publish-version.mjs "$LOCAL" "$PUBLISHED" "beta.${{ github.run_number }}.${{ github.run_attempt }}")
          echo "Publish create-target beta: local=$LOCAL npm=${PUBLISHED:-<none>} -> $NEW"
          node -e "
            const fs = require('fs');
            const p = JSON.parse(fs.readFileSync('package.json'));
            p.version = '$NEW';
            fs.writeFileSync('package.json', JSON.stringify(p, null, 2) + '\n');
          "
          bun run build:prod
          npm publish --access public --tag beta --provenance
