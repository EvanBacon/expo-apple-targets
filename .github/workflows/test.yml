name: Test

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - run: bun install --ignore-scripts

      # create-target imports `@bacons/apple-targets/build/target` for type
      # Info.plist defaults in expo-target.config templates. `build/` is
      # gitignored and prepare scripts are skipped above, so compile first.
      - name: Build apple-targets
        run: bun run build
        working-directory: packages/apple-targets

      - name: Test apple-targets
        run: bun run jest --no-watch
        working-directory: packages/apple-targets

      - name: Test create-target
        run: bun run jest
        working-directory: packages/create-target
