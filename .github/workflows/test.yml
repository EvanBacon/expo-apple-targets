name: Test

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile --ignore-scripts

      - name: Test apple-targets
        run: bun run jest --no-watch
        working-directory: packages/apple-targets

      - name: Test create-target
        run: bun run jest
        working-directory: packages/create-target

      - name: Build apple-targets
        run: bun run build
        working-directory: packages/apple-targets

      # Generates the iOS project for every fixture target. Compilation is the
      # macOS matrix in e2e.yml; this step fails the PR when prebuild itself breaks.
      - name: Prebuild e2e fixture
        run: bun -e 'import setup from "./e2e/setup.ts"; await setup();'
        working-directory: packages/apple-targets
